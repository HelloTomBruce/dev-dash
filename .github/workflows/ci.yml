name: CI - 校验部署可行性

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: 安装依赖
        run: npm ci

      - name: TypeScript 类型检查
        run: npx tsc --noEmit

      - name: ESLint
        run: npm run lint

      - name: Next.js 构建
        run: npm run build

      - name: 构建产物验证
        run: |
          # 验证 .next 目录存在且非空
          test -d .next && test -n "$(ls -A .next)"
          echo "✅ 构建产物验证通过"
